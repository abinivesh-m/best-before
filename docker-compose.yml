services:
  bifrost:
    image: maximhq/bifrost:v2.5.0
    command: ["-app-dir", "/app/data", "-host", "0.0.0.0", "-port", "8080"]
    ports:
      - "8080:8080"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - ./config.bifrost.json:/app/data/config.json:ro
      - bifrost-data:/app/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      BIFROST_URL: http://bifrost:8080
      BIFROST_MODEL: groq/openai/gpt-oss-120b
      BIFROST_FALLBACKS: groq/qwen/qwen3-32b
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LLM_WORKERS: "4"
    depends_on:
      - bifrost

volumes:
  bifrost-data:
